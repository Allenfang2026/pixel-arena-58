<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>58 斗兽场</title>
<style>
  :root { --bg:#0d0b14; --panel:#1a1626; --line:#4a4263; --ink:#ece8f7; --dim:#9a93b3; --gold:#ffc23d; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; }
  body { min-height:100dvh; display:flex; justify-content:center; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); }
  #app { width:100%; max-width:760px; }
  canvas { image-rendering:pixelated; image-rendering:crisp-edges; display:block; }
  h1 { font-size:28px; letter-spacing:4px; margin:6vh 0 4px; text-align:center; color:var(--gold); text-shadow:3px 3px 0 #8a1f17; }
  h2 { font-size:17px; font-weight:600; text-align:center; margin:22px 0 12px; }
  .screen { display:none; }
  .screen.on { display:block; }
  .row { display:grid; gap:10px; }
  .row.t { grid-template-columns:repeat(5,1fr); }
  .row.m { grid-template-columns:repeat(4,1fr); }
  @media (max-width:560px) { .row.m { grid-template-columns:repeat(2,1fr); } }
  .card { background:var(--panel); border:3px solid var(--line); padding:8px 6px 10px; cursor:pointer; text-align:center; color:inherit; font:inherit; min-height:44px; box-shadow:4px 4px 0 #000; transition:transform .08s; }
  .card:hover, .card:focus-visible { border-color:var(--gold); transform:translate(-1px,-2px); outline:none; }
  .card:active { transform:translate(2px,2px); box-shadow:1px 1px 0 #000; }
  .card canvas { width:100%; height:auto; background:#ebe8f0; margin-bottom:8px; }
  .card b { display:block; font-size:16px; }
  .card small { color:var(--dim); font-size:12px; }
  .el { display:inline-block; padding:0 6px; font-size:12px; line-height:18px; color:#000; font-weight:700; margin-left:4px; }
  #hud { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:8px; }
  .hp { background:var(--panel); border:3px solid var(--line); padding:6px 8px; }
  .hp.r { text-align:right; }
  .hp .n { font-size:15px; font-weight:700; white-space:nowrap; }
  .bar { height:10px; background:#000; border:2px solid #000; margin-top:5px; }
  .bar i { display:block; height:100%; width:100%; background:#5ad84a; transition:width .35s steps(12), background .2s; }
  .hp.r .bar i { margin-left:auto; }
  .hp .v { font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums; }
  #stage { border:3px solid var(--line); box-shadow:4px 4px 0 #000; background:#000; }
  #stage canvas { width:100%; height:auto; }
  #log { min-height:44px; margin:10px 0; padding:10px 12px; background:var(--panel); border:3px solid var(--line); font-size:15px; }
  #moves { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  #moves .card { padding:10px 4px; }
  #moves .card[disabled] { opacity:.35; pointer-events:none; }
  #end { text-align:center; margin-top:14px; display:none; }
  #end .card { display:inline-block; padding:10px 28px; }
  .chart { text-align:center; color:var(--dim); font-size:13px; margin-top:18px; }
</style>
</head>
<body>
<div id="app">
  <section id="s-trainer" class="screen on">
    <h1>58 斗兽场</h1>
    <h2>选你的训练师</h2>
    <div class="row t" id="trainers"></div>
  </section>
  <section id="s-mon" class="screen">
    <h2>选你的搭档</h2>
    <div class="row m" id="mons"></div>
    <p class="chart">潮 克 焰 · 焰 克 影 · 影 克 幻 · 幻 克 潮</p>
  </section>
  <section id="s-battle" class="screen">
    <div id="hud">
      <div class="hp" id="hpL"><div class="n"></div><div class="bar"><i></i></div><div class="v"></div></div>
      <div class="hp r" id="hpR"><div class="n"></div><div class="bar"><i></i></div><div class="v"></div></div>
    </div>
    <div id="stage"><canvas id="cv" width="320" height="200"></canvas></div>
    <div id="log"></div>
    <div id="moves"></div>
    <div id="end"><button class="card" id="again">再来一局</button></div>
  </section>
</div>
<script type="module" src="./game.js"></script>
</body>
</html>
